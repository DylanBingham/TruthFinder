<!DOCTYPE html>
<html>
<head>
    <title>Data Visualizations</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .chart-container {
            width: 800px;
            height: 400px;
            margin: 40px auto;
            border: 1px solid #ddd;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background: white;
        }
        .axis-label {
            font-size: 14px;
            font-family: sans-serif;
        }
        .chart-title {
            font-size: 18px;
            font-family: sans-serif;
            font-weight: bold;
        }
        .bar {
            fill: steelblue;
            fill-opacity: 0.7;
            stroke: black;
            stroke-width: 0.5;
        }
        .kde-line {
            fill: none;
            stroke: red;
            stroke-width: 2;
        }
        body {
            background-color: #f5f5f5;
            font-family: sans-serif;
        }
        
        .vertical-line {
            stroke: #FF5733;
            stroke-width: 5;
            stroke-dasharray: 5,5;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        
        .vertical-line:hover {
            stroke: #FF0000;
            stroke-width: 3;
        }
        
        .vertical-line-label {
            font-size: 12px;
            font-family: sans-serif;
            font-weight: bold;
        }
        
        .tooltip text {
            font-size: 12px;
            font-family: sans-serif;
            font-weight: bold;
            fill: #333;
        }
        
        .tooltip rect {
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body>
    <div id="flesch-reading-ease-chart" class="chart-container"></div>
    <div id="word-count-chart" class="chart-container"></div>
    <div id="overall-polarity-chart" class="chart-container"></div>
    <div id="overall-subjectivity-chart" class="chart-container"></div>
    <div id="avg-sentence-polarity-chart" class="chart-container"></div>
    <div id="avg-sentence-subjectivity-chart" class="chart-container"></div>
    <div id="num-speech-attributes-chart" class="chart-container"></div>

    <!-- Load individual chart scripts -->
    <script src="/static/flesch_reading_ease_chart.js"></script>
    <script src="/static/word_count_chart.js"></script>
    <script src="/static/overall_polarity_chart.js"></script>
    <script src="/static/overall_subjectivity_chart.js"></script>
    <script src="/static/avg_sentence_polarity_chart.js"></script>
    <script src="/static/avg_sentence_subjectivity_chart.js"></script>
    <script src="/static/num_speech_attributes_chart.js"></script>

    <script>
        // Load data and create all charts
        d3.csv("static/final_dataset_with_pca_d3.csv").then(data => {
            console.log("Data successfully loaded:", data);
            createFleschReadingEaseChart(data,-10);
            createWordCountChart(data,400);
            createOverallPolarityChart(data,0);
            createOverallSubjectivityChart(data,0);
            createAvgSentencePolarityChart(data,0.5);
            createAvgSentenceSubjectivityChart(data,0);
            createNumSpeechAttributesChart(data,20);
        }).catch(error => {
            console.error("Error loading the data:", error);
        });
    </script>
</body>
</html>
